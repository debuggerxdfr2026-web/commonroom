services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: commonroom
      POSTGRES_PASSWORD: commonroom
      POSTGRES_DB: commonroom
    ports:
      - "5432:5432"
    volumes:
      - commonroom-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commonroom -d commonroom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  commonroom-postgres:
